<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Transcounty Pharmacy — staff operations for POS, inventory, prescriptions, and finance across Kenya." />
    <meta name="theme-color" content="#0f6b63" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Transcounty Pharmacy | Staff Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: avoids CSS @import stall on first paint -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="splash" style="position:fixed; inset:0; background:#eef2f1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'DM Sans', system-ui, sans-serif; z-index:9999;">
      <div style="width:48px; height:48px; background:#0f6b63; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; font-family:Outfit, system-ui, sans-serif; margin-bottom:16px;">
        TP
      </div>
      <p style="color:#14201e; font-size:15px; margin:0 0 16px; font-weight:600; letter-spacing:-0.02em;">
        Transcounty Pharmacy
      </p>
      <div style="width:120px; height:3px; background:rgba(15, 107, 99, 0.12); border-radius:2px; overflow:hidden;">
        <div id="splash-bar" style="height:100%; width:30%; background:#0f6b63; border-radius:2px; animation:splashload 1.5s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes splashload {
        0%{transform:translateX(-200%)}
        100%{transform:translateX(400%)}
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Never leave users on the splash forever (slow JS / cold CDN / parse error).
      (function () {
        var hide = function () {
          var el = document.getElementById("splash");
          if (el) el.remove();
        };
        // React removes splash on first paint; this is a hard safety net.
        setTimeout(hide, 2500);
        window.addEventListener("load", function () {
          setTimeout(hide, 500);
        });
      })();
      // Kill stale service workers that cached broken shells / 404 SPA routes.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            reg.unregister();
          });
        });
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          });
        }
      }
    </script>
  </body>
</html>
