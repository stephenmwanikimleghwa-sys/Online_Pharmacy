<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Transcounty Pharmacy — staff operations for POS, inventory, prescriptions, and finance across Kenya." />
    <meta name="theme-color" content="#0f6b63" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Transcounty Pharmacy | Staff Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body style="margin:0;background:#eef2f1;min-height:100vh;">
    <div id="splash" style="position:fixed;inset:0;background:#eef2f1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;z-index:9999;">
      <div style="width:48px;height:48px;background:#0f6b63;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;margin-bottom:16px;">
        TP
      </div>
      <p style="color:#14201e;font-size:15px;margin:0 0 16px;font-weight:600;">
        Transcounty Pharmacy
      </p>
      <div style="width:120px;height:3px;background:rgba(15,107,99,0.12);border-radius:2px;overflow:hidden;">
        <div style="height:100%;width:30%;background:#0f6b63;border-radius:2px;animation:splashload 1.5s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes splashload {
        0% { transform: translateX(-200%); }
        100% { transform: translateX(400%); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        function hideSplash() {
          var el = document.getElementById("splash");
          if (el) el.remove();
        }
        var tries = 0;
        function tick() {
          tries += 1;
          var root = document.getElementById("root");
          if (root && root.childNodes && root.childNodes.length > 0) {
            hideSplash();
            return;
          }
          if (tries < 100) {
            setTimeout(tick, 100);
            return;
          }
          hideSplash();
          if (root && root.childNodes.length === 0) {
            root.innerHTML =
              '<div style="padding:2rem;font-family:system-ui;text-align:center;color:#14201e">' +
              "<p style=\"font-weight:700;margin-bottom:0.5rem\">Transcounty could not start</p>" +
              "<p style=\"margin-bottom:1rem;color:#475569\">Refresh the page. If it keeps failing, clear site data for this site.</p>" +
              '<button onclick="location.reload()" style="background:#0f6b63;color:#fff;border:0;padding:0.75rem 1.25rem;border-radius:0.5rem;font-weight:600;cursor:pointer">Refresh</button>' +
              "</div>";
          }
        }
        setTimeout(tick, 50);
      })();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      }
    </script>
  </body>
</html>
